{% set name = "biom-format" %}
{% set version = "2.1.18" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: fbb8cb19e459bbd1e8e2f8d34983a127245c6014f950ae082b9b19697484a315

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - biom = biom.cli:cli
  script_env:
    - USE_CYTHON=1

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
    - cython
    - numpy {{ numpy }}
  run:
    - python
    - click
    - numpy >=1.9.2
    - pandas >=0.20.0
    - scipy >=1.3.1
    - h5py
  run_constrained:
    - h5py >= 2.2.0

test:
  imports:
    - biom
    - biom.cli
    - biom._filter
    - biom._transform
    - biom._subsample
  requires:
    - pip
    - pytest >=6.2.4
  commands:
    - pip check
    - biom --help
    - python -c "from importlib.metadata import version as v; assert v('biom-format')=='{{ version }}'"
    - pytest -v --pyargs biom.tests

about:
  home: https://biom-format.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: COPYING.txt
  summary: Biological Observation Matrix (BIOM) format
  description: |
    The BIOM file format (canonically pronounced biome) is designed to be a 
    general-use format for representing biological sample by observation contingency tables.
    BIOM is a recognized standard for the Earth Microbiome Project and
    is a Genomics Standards Consortium supported project.
  doc_url: https://biom-format.org
  dev_url: https://github.com/biocore/biom-format

extra:
  recipe-maintainers:
    - synapticarbors
    - wasade
    - nsoranzo